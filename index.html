<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" href="img/2026-01-04_568df5f57fed1.png">
        <!-- CSS Variables et styles globaux -->
        <link rel="stylesheet" href="css/variables.css">
        <link rel="stylesheet" href="css/base.css">
        <!-- Layout principal -->
        <link rel="stylesheet" href="css/layout.css">
        <!-- Composants -->
        <link rel="stylesheet" href="css/sidebar.css">
        <link rel="stylesheet" href="css/header.css">
        <link rel="stylesheet" href="css/content.css">
        <link rel="stylesheet" href="css/skills.css">
        <link rel="stylesheet" href="css/projects.css">
        <link rel="stylesheet" href="css/right-panel.css">
        <!-- Animations -->
        <link rel="stylesheet" href="css/animations.css">
        <!-- Responsive -->
        <link rel="stylesheet" href="css/responsive.css">
        <title>Ilan DUFOURG: Portfolio</title>
        
    </head>
    <body>
        <aside class="vertical-banner">
            <div class="profile-container">
                <img class="profile-pic" src="img/pfp.jpg" alt="Profile">
                <div class="profile-texts">
                    <!-- content -->
                </div>
            </div>
            
            <nav class="buttons">
                <a class="button-link skill-button" data-page="profil">
                    <strong>Profil</strong>
                </a>
                <a class="button-link skill-button" data-page="competences">
                    <strong>Compétences</strong>
                </a>
                <a href="#" class="button-link skill-button" data-page="projets">
                    <strong>Projets</strong>
                </a>
                <a href="#" class="button-link skill-button" data-page="contact">
                    <strong>Contact</strong>
                </a>
                <a href="#" class="button-link skill-button" data-page="cv">
                    <strong>CV</strong>
                </a>
            </nav>
        </aside>
        
        <div class="layout-main-column">
            <header class="top-banner">
                <h1 class="page-title">Profil</h1>
            </header>
            
            <main class="content-wrapper">
                <div class="main-page-wrapper">
                    <div class="main-page" id="content">
                        <!-- content here -->
                    </div>
                </div>
                
                <footer class="main-page-footer">
                    © 2025 Mon Portfolio. Tous droits réservés.
                </footer>
            </main>
        </div>
        
        <aside class="right-page-wrapper" id="right-panel">
            <button id="right-panel-toggle" class="panel-toggle-btn" aria-label="Ouvrir le panneau">
                &lt;
            </button>
            
            <div class="right-page">
                <h3>Infos</h3>
                <div class="right-panel-content">
                    <p>Cliquez sur un projet ou une compétence pour obtenir des infos supplémentaires.</p>
                </div>
            </div>
        </aside>
        
        <!-- Scripts organisés par fonctionnalité -->
        <script src="scripts/profile.js"></script>
        <script src="scripts/main_slider.js"></script>
        <script src="scripts/skills.js"></script>
        <script src="scripts/tech-watch.js"></script>
        <script src="scripts/mobile-panel.js"></script>
        <script>
            // Gérer le chargement du PDF
            document.addEventListener('DOMContentLoaded', function() {
                const pdfObserver = new MutationObserver(function() {
                    const pdfViewer = document.getElementById('pdf-viewer');
                    if (pdfViewer) {
                        pdfViewer.addEventListener('error', function() {
                            const container = pdfViewer.closest('.pdf-container');
                            if (container) {
                                container.classList.add('pdf-not-found');
                                container.innerHTML = '<p>Le fichier CV.pdf n\'est pas disponible. Cliquez sur le bouton ci-dessous pour le télécharger directement.</p>';
                            }
                        });
                        pdfObserver.disconnect();
                    }
                });
                
                pdfObserver.observe(document.body, {
                    childList: true,
                    subtree: true
                });
            });
        </script>
    </body>
</html>
